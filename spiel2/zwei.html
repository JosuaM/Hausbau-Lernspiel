<body>
<!--
  Version 2, zwei Bildschirme:
    ?rolle=oben   zeigt an (Laptop / großer Bildschirm)
    ?rolle=unten  wird bedient (iPad oder zweites Fenster)
  Die Startseite (../index.html) öffnet beide Fenster.
-->
<div id="backdrop"></div>
<canvas id="stage3d"></canvas>
<div id="vignette"></div>
<div id="focus"></div>
<main id="ui"><p class="boot">Lädt …</p></main>
<script>
  window.addEventListener('error', function (e) {
    var box = document.getElementById('err');
    if (!box) {
      box = document.createElement('pre');
      box.id = 'err';
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;margin:0;padding:12px;border-radius:6px;background:#7f1d1d;color:#fff;font:13px/1.4 ui-monospace,monospace;white-space:pre-wrap';
      document.body.appendChild(box);
      box.textContent = 'Gerät: ' + navigator.userAgent + '\n';
    }
    box.textContent += 'Fehler: ' + e.message + '\n  in ' + (e.filename || '?').split('/').pop() + ' Zeile ' + e.lineno + ':' + e.colno + '\n';
  });
</script>
