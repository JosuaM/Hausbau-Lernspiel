<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hausbau 3D Prototyp</title>
<style>
  :root{--ink:#2b2a27;--mute:#77736a;--line:#dedad0;--bg:#f4f2ec;--acc:#2f6f73;--accl:#e1eeee}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;height:100%}
  #panel{width:320px;flex:none;padding:18px 18px 24px;overflow:auto;background:#fbfaf6;border-right:1px solid var(--line)}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:var(--mute);margin:0 0 16px;font-size:12.5px}
  h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font:inherit;color:var(--ink);cursor:pointer}
  .chip:hover{border-color:#b9b4a6}
  .chip[aria-pressed=true]{background:var(--accl);border-color:var(--acc);color:#174a4d;font-weight:600}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .row label.l{width:62px;color:var(--mute);font-size:12.5px}
  .btn{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
  input[type=range]{flex:1;accent-color:var(--acc);min-width:0}
  .val{min-width:62px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
  .bar{height:7px;border-radius:4px;background:#e8e4d9;overflow:hidden;margin:3px 0 9px}
  .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
  .bar.bad i{background:#b5533a}
  .rep{display:flex;justify-content:space-between;font-size:13px;gap:8px}
  .rep span:last-child{font-weight:600;text-align:right}
  .note{color:var(--mute);font-size:12px;margin-top:14px}
  #stage{position:relative;flex:1;min-width:0;background:#cfd8dc}
  #stage canvas{display:block;width:100%;height:100%}
  #resetCam{position:absolute;top:14px;right:14px}
  #loc{position:absolute;top:14px;left:14px;background:rgba(251,250,246,.92);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px;line-height:1.35;pointer-events:none}
  #loc b{display:block;font-size:13.5px}
  #hint{position:absolute;left:16px;bottom:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);font-size:12px;pointer-events:none}
  @media (max-width:760px){#app{flex-direction:column-reverse}#panel{width:100%;height:46%;border-right:0;border-top:1px solid var(--line)}}
</style>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>Hausbau 3D</h1>
    <p class="sub">Prototyp &middot; Szenario Überschwemmung &middot; Bangladesch</p>
    <div id="groups"></div>
    <h2>Flut und Sturm</h2>
    <div class="row"><label class="l">Fluss</label><input id="slider" type="range" min="0" max="100" value="0"><span class="val" id="lvl">0 cm</span></div>
    <div class="row"><label class="l">Sturm</label><input id="storm" type="range" min="0" max="100" value="12"><span class="val" id="bft">Bft 3</span></div>
    <div class="row">
      <button class="btn" id="play">Flut starten</button>
      <button class="btn sec" id="reset">Zurücksetzen</button>
    </div>
    <label class="row"><input type="checkbox" id="rain" checked> Regen anzeigen</label>
    <h2>Auswirkung</h2>
    <div id="report"></div>
    <p class="note">Prototyp: Schadenswerte sind einfache Platzhalter-Regeln zum Ausprobieren, noch nicht die Werte aus dem Spiel.</p>
  </aside>
  <main id="stage">
    <div id="loc"><b>Sirajganj, Bangladesch</b>Ufer des Jamuna &middot; Regenzeit</div>
    <button class="btn sec" id="resetCam">Hauptansicht</button>
    <div id="hint">Ziehen = drehen &middot; Scrollen = zoomen</div>
  </main>
</div>

<script>
(()=>{
const T=THREE;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const smooth=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t;
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const R2=(a,b)=>a+(b-a)*rnd();
const hsh=(x,y,z,k)=>{const h=Math.sin(x*127.1+y*311.7+z*74.7+k*19.19)*43758.5453;return h-Math.floor(h)};

/* ---------- Helfer ---------- */
function jit(g,ax,ay=ax,az=ax){
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const a=Math.round(x*1e3),b=Math.round(y*1e3),c=Math.round(z*1e3);
    p.setXYZ(i,x+(hsh(a,b,c,1)-.5)*ax,y+(hsh(a,b,c,2)-.5)*ay,z+(hsh(a,b,c,3)-.5)*az);
  }
  g.computeVertexNormals();return g;
}
const C=h=>new T.Color(h).convertSRGBToLinear();
const col=h=>h&&h.isColor?h:C(h);
function paint(g,hex,v=.08){
  g=g.index?g.toNonIndexed():g;
  const n=g.attributes.position.count,c=new Float32Array(n*3),b=C(hex);
  for(let i=0;i<n;i+=3){const k=1+(rnd()-.5)*2*v;for(let j=0;j<3;j++){c[(i+j)*3]=b.r*k;c[(i+j)*3+1]=b.g*k;c[(i+j)*3+2]=b.b*k}}
  g.setAttribute('color',new T.BufferAttribute(c,3));g.computeVertexNormals();return g;
}
const std=(c,o={})=>{o=Object.assign({},o);if(o.emissive!==undefined)o.emissive=C(o.emissive);return new T.MeshStandardMaterial(Object.assign({color:C(c),flatShading:true,roughness:.95,metalness:0},o))};
const bas=(c,o={})=>new T.MeshBasicMaterial(Object.assign({color:C(c)},o));
const matV=std(0xffffff,{vertexColors:true});
const box=(w,h,d,sx=1,sy=1,sz=1)=>new T.BoxGeometry(w,h,d,sx,sy,sz);
function add(parent,geo,mat,x=0,y=0,z=0,o={}){
  const m=new T.Mesh(geo,mat);m.position.set(x,y,z);
  if(o.r)m.rotation.set(o.r[0],o.r[1],o.r[2]);
  if(o.s)m.scale.set(o.s[0],o.s[1],o.s[2]);
  m.castShadow=o.cast!==false;m.receiveShadow=o.recv!==false;parent.add(m);return m;
}
function ctex(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.encoding=T.sRGBEncoding;t.anisotropy=8;return t;
}
const rep=(t,x,y)=>{t=t.clone();t.repeat.set(x,y);t.needsUpdate=true;return t};
const speck=(x,w,h,n,sz,a)=>{for(let i=0;i<n;i++){const d=rnd()<.5;x.fillStyle=d?`rgba(30,20,10,${a*rnd()})`:`rgba(255,250,235,${a*rnd()})`;x.fillRect(rnd()*w,rnd()*h,1+rnd()*sz,1+rnd()*sz*.6)}};

/* ---------- MeshBuilder: viele Teile -> ein Mesh (Vertexfarben) ---------- */
const _E=new T.Euler(),_Q=new T.Quaternion(),_V=new T.Vector3(),_S=new T.Vector3();
function xf(x,y,z,o={}){const r=o.r||[0,0,0],s=o.s||[1,1,1];_E.set(r[0],r[1],r[2],'YXZ');_Q.setFromEuler(_E);_V.set(x,y,z);_S.set(s[0],s[1],s[2]);return new T.Matrix4().compose(_V,_Q,_S)}
const UBOX=new T.BoxGeometry(1,1,1);
class MB{
  constructor(){this.P=[];this.K=[]}
  addGeo(g0,m,hex,v=.06){
    const g=g0.index?g0.toNonIndexed():g0.clone();g.applyMatrix4(m);
    const a=g.attributes.position.array,b=col(hex),n=a.length/9;
    for(let i=0;i<n;i++){const k=1+(rnd()-.5)*2*v;for(let j=0;j<9;j++)this.P.push(a[i*9+j]);for(let j=0;j<3;j++)this.K.push(b.r*k,b.g*k,b.b*k)}
    g.dispose();return this;
  }
  box(w,h,d,x,y,z,hex,o={}){return this.addGeo(UBOX,xf(x,y,z,Object.assign({},o,{s:[w,h,d]})),hex,o.v)}
  cyl(rt,rb,h,seg,x,y,z,hex,o={}){return this.addGeo(new T.CylinderGeometry(rt,rb,h,seg),xf(x,y,z,o),hex,o.v)}
  cone(r,h,seg,x,y,z,hex,o={}){return this.addGeo(new T.ConeGeometry(r,h,seg),xf(x,y,z,o),hex,o.v)}
  ico(r,det,x,y,z,hex,o={}){let g=new T.IcosahedronGeometry(1,det);if(o.j)jit(g,o.j);const s=o.s||[1,1,1];return this.addGeo(g,xf(x,y,z,Object.assign({},o,{s:[s[0]*r,s[1]*r,s[2]*r]})),hex,o.v)}
  tri(a,b,c,hex,v=.05){const k=1+(rnd()-.5)*2*v,q=col(hex);
    for(const t of[[a,b,c],[a,c,b]])for(const p of t){this.P.push(p[0],p[1],p[2]);this.K.push(q.r*k,q.g*k,q.b*k)}return this}
  quad(a,b,c,d,hex,v){this.tri(a,b,c,hex,v);return this.tri(a,c,d,hex,v)}
  geo(){const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(new Float32Array(this.P),3));
    g.setAttribute('color',new T.BufferAttribute(new Float32Array(this.K),3));g.computeVertexNormals();return g}
  mesh(){const m=new T.Mesh(this.geo(),matV);m.castShadow=m.receiveShadow=true;return m}
}

/* ---------- Texturen ---------- */
const TEX={
  mud:ctex(512,256,(x,w,h)=>{x.fillStyle='#b08a60';x.fillRect(0,0,w,h);speck(x,w,h,1400,10,.14);
    for(let y=0;y<h;y+=43){x.fillStyle='rgba(70,45,25,.2)';x.fillRect(0,y+rnd()*4,w,3);}
    for(let i=0;i<70;i++){x.strokeStyle='rgba(214,190,120,.55)';x.lineWidth=1.2;const px=rnd()*w,py=rnd()*h;x.beginPath();x.moveTo(px,py);x.lineTo(px+8+rnd()*22,py+(rnd()-.5)*5);x.stroke()}}),
  brick:ctex(256,256,(x,w,h)=>{x.fillStyle='#cdbfa8';x.fillRect(0,0,w,h);const bh=21,bw=52;
    for(let r=0;r*bh<h;r++)for(let c=-1;c*bw<w;c++){const ox=(r%2)*bw/2;const k=.82+rnd()*.3;
      x.fillStyle=`rgb(${176*k|0},${88*k|0},${62*k|0})`;x.fillRect(c*bw+ox+2,r*bh+2,bw-4,bh-4)}speck(x,w,h,500,4,.12)}),
  plaster:ctex(256,256,(x,w,h)=>{x.fillStyle='#dccfb4';x.fillRect(0,0,w,h);speck(x,w,h,900,6,.1);
    for(let i=0;i<14;i++){const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(90,70,40,0)');g.addColorStop(1,'rgba(90,70,40,.12)');x.fillStyle=g;x.fillRect(rnd()*w,0,6+rnd()*14,h)}}),
  tin:ctex(256,256,(x,w,h)=>{const p=32;for(let i=0;i<w;i++){const k=.5+.5*Math.cos((i%p)/p*Math.PI*2);const v=135+k*55;x.fillStyle=`rgb(${v*.93|0},${v*.99|0},${v|0})`;x.fillRect(i,0,1,h)}
    for(let i=0;i<260;i++){x.fillStyle=`rgba(120,62,30,${.05+rnd()*.12})`;x.fillRect(rnd()*w,h*(.35+rnd()*.65),1+rnd()*4,3+rnd()*18)}
    for(let i=0;i<8;i++){x.fillStyle='rgba(90,100,105,.4)';x.fillRect(0,i*32+rnd()*3,w,1.5)}}),
  ferro:ctex(256,256,(x,w,h)=>{x.fillStyle='#c4c8c3';x.fillRect(0,0,w,h);speck(x,w,h,900,16,.07);
    for(let i=0;i<30;i++){x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=5;x.beginPath();const px=rnd()*w,py=rnd()*h;x.moveTo(px,py);x.lineTo(px+30+rnd()*50,py+(rnd()-.5)*20);x.stroke()}}),
  tile:ctex(64,64,(x,w,h)=>{x.fillStyle='#6d2a22';x.fillRect(0,0,w,h)}),
  thatch:ctex(256,256,(x,w,h)=>{x.fillStyle='#b19552';x.fillRect(0,0,w,h);
    for(let i=0;i<1500;i++){const k=rnd();x.strokeStyle=k<.4?'rgba(110,86,36,.55)':k<.8?'rgba(214,190,110,.55)':'rgba(120,130,60,.45)';x.lineWidth=1.2;const px=rnd()*w,py=rnd()*h;x.beginPath();x.moveTo(px,py);x.lineTo(px+(rnd()-.5)*6,py+10+rnd()*26);x.stroke()}}),
  wood:ctex(128,128,(x,w,h)=>{x.fillStyle='#8a5f3d';x.fillRect(0,0,w,h);for(let i=0;i<w;i+=16){x.fillStyle=`rgba(40,22,10,${.25+rnd()*.15})`;x.fillRect(i,0,2,h)}speck(x,w,h,300,3,.1)}),
  concrete:ctex(256,256,(x,w,h)=>{x.fillStyle='#b7b5ae';x.fillRect(0,0,w,h);speck(x,w,h,1400,5,.14)}),
  mat:ctex(256,256,(x,w,h)=>{x.fillStyle='#b99f68';x.fillRect(0,0,w,h);
    for(let i=-16;i<16;i++){x.strokeStyle=i%2?'rgba(110,84,40,.5)':'rgba(236,214,150,.5)';x.lineWidth=7;x.beginPath();x.moveTo(i*16,0);x.lineTo(i*16+h,h);x.stroke();x.beginPath();x.moveTo(i*16+h,0);x.lineTo(i*16,h);x.stroke()}
    speck(x,w,h,500,5,.1)}),
  rice:ctex(256,256,(x,w,h)=>{x.fillStyle='#6a5d3c';x.fillRect(0,0,w,h);
    for(let r=0;r<16;r++){const y=r*16+4;for(let i=0;i<w;i+=5){x.fillStyle=`rgb(${96+rnd()*34|0},${150+rnd()*46|0},${58+rnd()*26|0})`;x.fillRect(i+rnd()*3,y+rnd()*3,4,9+rnd()*4)}}
    x.fillStyle='rgba(120,170,190,.16)';for(let i=0;i<8;i++)x.fillRect(rnd()*w,rnd()*h,20+rnd()*30,3)}),
  rice2:ctex(256,256,(x,w,h)=>{x.fillStyle='#6f8b86';x.fillRect(0,0,w,h);speck(x,w,h,500,12,.05);
    for(let r=0;r<20;r++)for(let i=0;i<w;i+=9){x.fillStyle=`rgb(${90+rnd()*30|0},${170+rnd()*40|0},${70+rnd()*30|0})`;x.fillRect(i+rnd()*3,r*13+rnd()*3,3,6+rnd()*3)}}),
  sail:ctex(256,256,(x,w,h)=>{x.fillStyle='#d8caa4';x.fillRect(0,0,w,h);
    const cs=['#c9b88c','#b24a32','#e4dac0','#a89a6e','#c78652','#d2c49b'];
    for(let i=0;i<22;i++){x.fillStyle=cs[i%cs.length];x.globalAlpha=.9;x.fillRect(rnd()*w*.9,rnd()*h*.9,28+rnd()*70,24+rnd()*60)}
    x.globalAlpha=1;x.strokeStyle='rgba(70,50,30,.45)';x.lineWidth=1;for(let i=0;i<=h;i+=18){x.beginPath();x.moveTo(0,i);x.lineTo(w,i);x.stroke()}}),
  gauge:ctex(64,512,(x,w,h)=>{x.fillStyle='#f1eee4';x.fillRect(0,0,w,h);const tot=1.7;
    for(let c=0;c<=100;c+=5){const y=h*(1-c/100/tot);x.fillStyle=c%25===0?'#b5533a':'#555';x.fillRect(c%25===0?0:w*.55,y-1,c%25===0?w:w*.45,2.5)}
    x.fillStyle='#222';x.font='bold 17px sans-serif';[25,50,75,100].forEach(c=>x.fillText(c,3,h*(1-c/100/tot)-4))}),
  flag:ctex(256,154,(x,w,h)=>{x.fillStyle='#006a4e';x.fillRect(0,0,w,h);x.fillStyle='#f42a41';x.beginPath();x.arc(w*.45,h/2,h*.3,0,7);x.fill()}),
  sun:ctex(128,128,(x,w,h)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,246,214,1)');g.addColorStop(.25,'rgba(255,232,170,.55)');g.addColorStop(1,'rgba(255,220,150,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}),
  smoke:ctex(64,64,(x,w,h)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(200,200,200,.9)');g.addColorStop(1,'rgba(200,200,200,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}),
};
['gauge','flag','sail'].forEach(k=>{TEX[k].wrapS=TEX[k].wrapT=T.ClampToEdgeWrapping});

/* ---------- Szene ---------- */
const stage=document.getElementById('stage');
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const scene=new T.Scene();
scene.fog=new T.Fog(0xeadfc8,45,135);
const camera=new T.PerspectiveCamera(40,1,.5,500);
const HOME={pos:new T.Vector3(5.8,5.0,10.4),tgt:new T.Vector3(0,1.7,0)};
camera.position.copy(HOME.pos);
const controls=new T.OrbitControls(camera,renderer.domElement);
controls.target.copy(HOME.tgt);controls.enableDamping=true;controls.dampingFactor=.08;
controls.enablePan=false;controls.minDistance=6;controls.maxDistance=48;
controls.minPolarAngle=.55;controls.maxPolarAngle=1.5;controls.update();

const hemi=new T.HemisphereLight(0xfff3df,0x7d8a6a,.85);scene.add(hemi);
const sun=new T.DirectionalLight(0xffefd2,1.75);sun.position.set(7,11,6);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:48});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;scene.add(sun);
const fill=new T.DirectionalLight(0xbcd0e8,.35);fill.position.set(-8,4,-6);scene.add(fill);

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=Math.max(40,2*Math.atan(Math.tan(30*Math.PI/180)/(w/h)*1.3)*180/Math.PI);camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();

/* ---------- Himmel ---------- */
const skyU={top:{value:new T.Color()},bot:{value:new T.Color()},flash:{value:0}};
const sky=new T.Mesh(new T.SphereGeometry(320,24,12),new T.ShaderMaterial({uniforms:skyU,side:T.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;uniform float flash;varying vec3 vP;void main(){float h=clamp(vP.y,0.,1.);vec3 c=mix(bot,top,pow(h,.5));c+=flash*vec3(.55,.6,.8);gl_FragColor=linearToOutputTexel(vec4(c,1.));}'}));
sky.renderOrder=-10;sky.frustumCulled=false;scene.add(sky);
const sunDir=new T.Vector3(.5,.32,-.55).normalize();
const sunSprite=new T.Sprite(new T.SpriteMaterial({map:TEX.sun,transparent:true,depthWrite:false,fog:false,blending:T.AdditiveBlending}));
sunSprite.scale.set(110,110,1);sunSprite.position.copy(sunDir).multiplyScalar(280);scene.add(sunSprite);
const cloudMat=std(0xffffff,{roughness:1,transparent:true,opacity:.96});
const clouds=[];
function makeCloud(){const g=new T.Group();
  for(let i=0;i<7;i++){const b=new T.Mesh(jit(new T.IcosahedronGeometry(1,2),.35),cloudMat);
    b.position.set((i-3)*1.0+(rnd()-.5),(rnd()-.3)*.6,(rnd()-.5)*1.4);b.scale.set(1.4+rnd(),.55+rnd()*.3,1.1+rnd()*.5);g.add(b)}
  return g}
seed=5;
for(let i=0;i<24;i++){const g=makeCloud(),a=rnd()*6.28,r=75+rnd()*95,st=i>=12;
  const s=st?13+rnd()*9:8+rnd()*8;g.userData={a,r,y:st?24+rnd()*8:36+rnd()*14,s,storm:st,sp:.004+rnd()*.006};scene.add(g);clouds.push(g)}

/* ---------- Welt: x = u (entlang Fluss), z = -s (zum Fluss: -z). Haus bei 0/0, Tür nach +z ---------- */
const WD=[.2,.98];                                  // Wind/Wellen: vom Fluss zum Haus (+z)
const toXZ=(s,u)=>[u,-s];
const toSU=(x,z)=>[-z,x];
const L0=-.85;
const sc=u=>30+3.5*Math.sin(u*.045)+2*Math.sin(u*.11+1);
const PONDS=[[-15,-1.5,4.8],[-39.5,-2,4.2],[39.5,-2,4.4],[64,-1,3.6],[-64,-1.5,3.8]];
function hAt(x,z){
  const [s,u]=toSU(x,z),r=Math.hypot(x,z),bl=smooth(5,10,r);
  let hn=s>0?-.04*s:(.03*-s+.0006*s*s);
  hn=Math.min(hn,1.6)*bl+.07*Math.sin(x*.31+1)*Math.sin(z*.27)*bl;
  const d=s-sc(u),ad=Math.abs(d);
  const bankH=d<0?hn:-.1+.012*Math.max(0,d-14);
  const k=1-smooth(8.5,14,ad);
  let h=bankH*(1-k)-1.5*k;
  if(ad<9){const bump=smooth(.55,.9,.5+.5*Math.sin(u*.07+1.3)*Math.sin(s*.11+.4));h=Math.max(h,-1.5+bump*1.25*(1-smooth(5,9,ad)))}
  for(const [px,pz,pr] of PONDS){const dd=Math.hypot(x-px,z-pz);if(dd<pr+2.5)h=lerp(h,-1.35,1-smooth(pr-1.8,pr+2.2,dd))}
  return h;
}
function dirtAmt(x,z){
  let d=1-smooth(1.0,1.9,Math.abs(z-7.6));                                   // Dorfweg
  const dx=Math.abs(x)-9.0,dz=Math.abs(z+.35)-6.3;d=Math.max(d,1-smooth(0,1.8,Math.max(dx,dz)));   // eigener Hof
  if(z>5&&z<8.2)d=Math.max(d,1-smooth(.5,1.3,Math.abs(x)));                  // Weg zum Tor
  // Pfad zum Fluss (Anleger)
  const ax=11,az=-7,bx=13.5,bz=-16.5,t=clamp(((x-ax)*(bx-ax)+(z-az)*(bz-az))/((bx-ax)**2+(bz-az)**2));
  d=Math.max(d,1-smooth(.5,1.2,Math.hypot(x-(ax+t*(bx-ax)),z-(az+t*(bz-az)))));
  return d;
}

  let prev=null;
  for(let i=0;i<=N;i++){const t=i/N,x=-len/2+len*t,s=sec(t).map(p=>[x,p[1],p[0]]);
    if(prev)for(let j=0;j<6;j++)mb.quad(prev[j],prev[j+1],s[j+1],s[j],bands[j],.04);
    prev=s}
  mb.box(len*.8,.05,wid*.7,0,hgt*.34,0,0x8a6b45);

  }

  if(S.extra==='vetiver'){
    const bl=jit(new T.ConeGeometry(.06,.9,3),.02),im=new T.InstancedMesh(bl,std(0xffffff),260),d=new T.Object3D(),c=new T.Color();let n=0;
    for(let k=0;k<52;k++){const a=k/52*6.283,r=(plat?4.3:3.7)+(k%2)*.25,bx=Math.cos(a)*r,bz=Math.sin(a)*r;
      if(Math.abs(bx)<.9&&bz>0)continue;
      for(let b=0;b<5&&n<260;b++){d.position.set(bx+(rnd()-.5)*.35,.38,bz+(rnd()-.5)*.35);d.rotation.set((rnd()-.5)*.5,rnd()*6,(rnd()-.5)*.5);d.scale.set(1,.7+rnd()*.7,1);d.updateMatrix();
        im.setMatrixAt(n,d.matrix);c.setHSL(.22+rnd()*.05,.42,.3+rnd()*.12).convertSRGBToLinear();im.setColorAt(n,c);n++}}
    im.count=n;im.castShadow=true;dyn.add(im);
  }
  if(S.extra==='frame'){
    [[-2.58,-2.58],[2.58,-2.58],[-2.58,2.58],[2.58,2.58]].forEach(([x,z])=>add(hg,box(.17,H-.12,.17),woodM,x,(H-.12)/2,z));
    [.32,H-.3].forEach(y=>{[2.6,-2.6].forEach(z=>add(hg,box(5.3,.11,.11),woodM,0,y,z));[2.6,-2.6].forEach(x=>add(hg,box(.11,.11,5.3),woodM,x,y,0))});
    [-1,1].forEach(a=>add(hg,box(1.0,.1,.1),woodM,a*2.1,H-.6,2.6,{r:[0,0,a*Math.PI/4]}));
    add(hg,box(.1,.1,1.0),woodM,2.6,H-.6,2.1,{r:[0,0,Math.PI/4]});add(hg,box(.1,.1,1.0),woodM,2.6,H-.6,-2.1,{r:[0,0,-Math.PI/4]});
  }
  if(S.extra==='well'){
    const sx=-4.3,sz=2.1,top=1.25;
    add(dyn,box(1.7,top,1.7),conc,sx,top/2,sz);
    for(let i=0;i<5;i++)add(dyn,box(.3,top*(5-i)/5,1.0),conc,sx+.85+.16+i*.3,top*(5-i)/5/2,sz);
    const p=new T.Group();p.position.set(sx,top,sz);dyn.add(p);
    add(p,new T.CylinderGeometry(.08,.1,.8,6),std(0x4a5a64),0,.4,0);add(p,box(.3,.12,.14),std(0x4a5a64),.08,.82,0);
    add(p,box(.7,.05,.06),std(0x2c3640),-.3,.9,0,{r:[0,0,.35]});add(p,box(.2,.05,.06),std(0x4a5a64),.25,.6,0);
    const lx=-4.3,lz=-1.4;
    add(dyn,box(1.7,top,1.7),conc,lx,top/2,lz);
    for(let i=0;i<5;i++)add(dyn,box(.3,top*(5-i)/5,1.0),conc,lx+.85+.16+i*.3,top*(5-i)/5/2,lz);
    const hut=new T.Group();hut.position.set(lx,top,lz);dyn.add(hut);
    add(hut,box(1.15,1.6,1.15),std(0xffffff,{map:rep(TEX.tin,3,1)}),0,.8,0);
    add(hut,box(1.3,.06,1.4),std(0x6f7b80),0,1.68,0,{r:[.0,0,.08]});
    add(hut,box(.5,1.2,.05),woodM,.2,.62,.6);
  }
}

/* ---------- Zustand: Fluss-Pegel L, Sturm ---------- */
let L=L0,storm=.12,stormTarget=null;
const els={groups:document.getElementById('groups'),rep:document.getElementById('report'),lvl:document.getElementById('lvl'),slider:document.getElementById('slider'),
           stormS:document.getElementById('storm'),bft:document.getElementById('bft')};
const levelFromV=v=>L0+(1-L0)*v/100;
const vFromLevel=l=>(l-L0)/(1-L0)*100;

function applyWind(){
  const loss=smooth(.4,1,storm)*ROOF[S.roof].wind*.55;
  const q=Math.round(loss*50)/50;
  if(R.tiles&&R.lossShown!==q){R.lossShown=q;
    const z=new T.Matrix4().makeScale(0,0,0);
    R.tiles.list.forEach(t=>{t.mats.forEach((m,i)=>t.inst.setMatrixAt(i,t.thr[i]<q?z:m));t.inst.instanceMatrix.needsUpdate=true})}
  return loss;
}
function applyLevel(Lv){
  L=clamp(Lv,L0,1);
  water.position.y=L;
  const F=R.F,amp=wu.uAmp.value,Weff=L+amp*1.1;
  const depth=Math.max(0,Weff-F),Wg=Math.max(0,L);
  const frame=S.extra==='frame',vuln=WALL[S.wall].vuln*(frame?.45:1);
  const e=(S.found==='earth'&&S.extra!=='platform')?clamp((Weff-.12)/.8)*(S.extra==='vetiver'?.5:1)*(1+storm*.25):0;
  const e1=clamp(e);
  const dmg=clamp(depth*vuln+(S.wall==='mud'?e1*.35:0));
  const wetH=depth>0?Math.min(R.H,depth+(S.wall==='mud'||S.wall==='brickwall'?.3:.1)):0;
  R.wet.visible=wetH>.01;R.wet.scale.y=Math.max(.001,wetH);R.wet.position.y=wetH/2;
  R.wallMat.color.setScalar(1-.14*dmg);
  R.marks.forEach(m=>{const p=clamp((dmg-m.thr)/.18);m.g.visible=p>0;m.g.scale.setScalar(Math.max(.01,p))});
  if(R.earth){const sx=1-.2*e1,sy=1-.3*e1;R.earth.scale.set(sx,sy,sx);R.earth.position.y=.17*sy;R.earthMat.color.copy(C(0xd8c4a8)).multiplyScalar(1-.3*e1)}
  const tilt=e1*(S.wall==='mud'?.075:.03)*(frame?.4:1);
  R.hg.position.y=F-e1*.1;R.hg.rotation.z=tilt;R.hg.rotation.x=e1*.02;
  const stress=dmg*ROOF[S.roof].weight,sag=smooth(.35,1,stress)*.3;
  R.sag=sag;R.roof.position.y=R.H-.04-sag;R.roof.rotation.z=sag*.14;R.roof.rotation.x=sag*.05;
  const loss=applyWind();
  wmat.color.copy(C(0x4a8fa8)).lerp(C(0x7a6845),smooth(-.75,-.1,L));
  const cmW=Math.round(Wg*100),fc=Math.round(F*100),dc=Math.round(depth*100);
  els.lvl.textContent=L<=0?'im Bett':'+'+cmW+' cm';els.slider.value=Math.round(vFromLevel(L));
  els.bft.textContent='Bft '+Math.round(3+9*storm);
  const bar=(l,v,bad,txt)=>`<div class="rep"><span>${l}</span><span>${txt}</span></div><div class="bar ${bad?'bad':''}"><i style="width:${Math.round(clamp(v)*100)}%"></i></div>`;
  const rt={tinhip:storm>.55?'klappert, Bleche lösen sich':'hält',concreteflat:'hält',tilegable:loss>.02?Math.round(loss*100)+' % der Ziegel fehlen':'hält',thatch:storm>.55?'Gras wird weggerissen':'hält'}[S.roof];
  els.rep.innerHTML=
    `<div class="rep"><span>Boden im Haus</span><span>${fc} cm über Gelände</span></div><div class="bar"><i style="width:${clamp(F/1.4)*100}%"></i></div>`+
    bar('Wasser im Haus',depth,depth>0,dc>0?dc+' cm':'trocken')+
    bar('Wandschaden',dmg,dmg>.5,Math.round(dmg*100)+' %')+
    bar('Fundament-Erosion',e1,e1>.5,Math.round(e1*100)+' %')+
    bar('Dach (Last)',sag/.3,sag>.14,sag<.02?'stabil':sag<.14?'senkt sich':'droht einzustürzen')+
    bar('Dach (Wind)',loss/.5,loss>.15,rt);
}

/* ---------- UI ---------- */
const GROUPS=[['found','Fundament',FOUND],['wall','Wand',WALL],['roof','Dach',ROOF],['extra','Besonderheit',EXTRA]];
GROUPS.forEach(([key,title,opts])=>{
  const h=document.createElement('h2');h.textContent=title;els.groups.appendChild(h);
  const row=document.createElement('div');row.className='chips';els.groups.appendChild(row);
  Object.entries(opts).forEach(([id,o])=>{const b=document.createElement('button');b.className='chip';b.textContent=o.name;b.dataset.k=key;b.dataset.id=id;
    b.setAttribute('aria-pressed',S[key]===id);
    b.onclick=()=>{S[key]=id;row.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.id===id));build();applyLevel(L)};row.appendChild(b)});
});
let playing=false,prog=0;
const playBtn=document.getElementById('play');
function setPlaying(p){if(p&&prog>=.999)prog=0;playing=p;playBtn.textContent=p?'Pause':(prog>=.999?'Nochmal':'Flut starten')}
playBtn.onclick=()=>setPlaying(!playing);
document.getElementById('reset').onclick=()=>{setPlaying(false);prog=0;stormTarget=null;storm=.12;els.stormS.value=12;applyLevel(L0);playBtn.textContent='Flut starten'};
els.slider.oninput=()=>{setPlaying(false);prog=els.slider.value/100;applyLevel(levelFromV(els.slider.value))};
els.stormS.oninput=()=>{stormTarget=null;storm=els.stormS.value/100;applyLevel(L)};
const rainBox=document.getElementById('rain');
let camTween=null;
document.getElementById('resetCam').onclick=()=>{camTween={t:0,p0:camera.position.clone(),t0:controls.target.clone()}};

/* ---------- Loop ---------- */
const clock=new T.Clock();let tt=0,lastL=-9,lastStorm=-9;
const cTop0=new T.Color(0x78aedb),cBot0=new T.Color(0xeadfc8),cTop1=new T.Color(0x27313b),cBot1=new T.Color(0x676d72),tmpA=new T.Color(),tmpB=new T.Color();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);tt+=dt;

  if(playing){prog=Math.min(1,prog+dt/26);stormTarget=smooth(.05,.8,prog);L=levelFromV(prog*100);if(prog>=1)setPlaying(false)}
  if(stormTarget!==null){storm+=(stormTarget-storm)*Math.min(1,dt*1.2);els.stormS.value=Math.round(storm*100)}
  if(playing||Math.abs(L-lastL)>1e-4||Math.abs(storm-lastStorm)>.004){lastL=L;lastStorm=storm;applyLevel(L)}

  if(camTween){camTween.t=Math.min(1,camTween.t+dt/.9);const k=smooth(0,1,camTween.t);
    camera.position.lerpVectors(camTween.p0,HOME.pos,k);controls.target.lerpVectors(camTween.t0,HOME.tgt,k);if(camTween.t>=1)camTween=null}

  tmpA.copy(cTop0).lerp(cTop1,storm);tmpB.copy(cBot0).lerp(cBot1,storm);
  skyU.top.value.copy(tmpA).convertSRGBToLinear();skyU.bot.value.copy(tmpB).convertSRGBToLinear();
  scene.fog.color.copy(tmpB);scene.fog.near=lerp(45,14,storm);scene.fog.far=lerp(135,80,storm);
  sky.position.copy(camera.position);
  sunSprite.material.opacity=1-smooth(.1,.6,storm);sunSprite.visible=sunSprite.material.opacity>.01;
  cloudMat.color.copy(C(0xffffff)).lerp(C(0x4a525a),smooth(.05,.7,storm));
  clouds.forEach(c=>{const d=c.userData;d.a+=d.sp*dt*(1+storm*5);
    const k=d.storm?smooth(.15,.65,storm):1;
    c.position.set(Math.cos(d.a)*d.r,d.y-(d.storm?0:storm*8),Math.sin(d.a)*d.r);c.scale.setScalar(Math.max(.001,d.s*k))});
  flash=Math.max(0,flash-dt*3.2);
  hemi.intensity=lerp(.85,.55,storm)+flash*2.4;sun.intensity=lerp(1.75,.55,storm)+flash*.8;
  renderer.toneMappingExposure=lerp(1.05,.92,storm);
  skyU.flash.value=flash*.55;

  wu.uTime.value=tt;
  wu.uAmp.value=lerp(.012,.115,Math.pow(storm,1.2))*(.6+.4*smooth(-.8,0,L));
  wu.uFoam.value=smooth(.3,.85,storm);

  const w=storm,lean=w*.16;
  sway.forEach(s=>{const a=Math.sin(tt*s.sp*(1+w*2.5)+s.ph)*s.amp*(.5+w*2.2);
    s.o.rotation.x=lean*WD[1]*(s.amp*40)+a*WD[1];s.o.rotation.z=-lean*WD[0]*(s.amp*40)-a*WD[0]});
  if(flagMesh){flagMesh.rotation.y=-.2;flagMesh.rotation.z=-(1-clamp(.35+w*.9))*1.1;
    const p=fgeo.attributes.position,k=.06+w*.22,sp=4+w*8;
    for(let i=0;i<p.count;i++){const x=fBase[i*3];p.setZ(i,Math.sin(x*4.2-tt*sp)*k*x)}
    p.needsUpdate=true;fgeo.computeVertexNormals()}

  if(R&&R.roof){const rat=ROOF[S.roof].wind*smooth(.45,1,storm);R.roof.position.x=Math.sin(tt*38)*.012*rat}

  // Boote auf dem Fluss: Bug entlang Fahrtrichtung (+x / -x), schwimmen im Wasser
  const bob=.025+wu.uAmp.value*.55;
  boats.forEach(b=>{b.u+=b.dir*dt*(b.kind==='big'?1.1:1.6)*(1+storm*.6);if(b.u>95)b.u=-95;if(b.u<-95)b.u=95;
    const s=sc(b.u)+b.off,[x,z]=toXZ(s,b.u),gy=hAt(x,z);
    b.g.position.set(x,Math.max(gy+.05,L-.22)+Math.sin(tt*1.3+b.ph)*bob,z);
    b.g.rotation.set(Math.sin(tt*1.1+b.ph)*(.01+storm*.07),b.dir>0?0:Math.PI,Math.cos(tt*.9+b.ph)*(.01+storm*.06))});
  // Flöße/Kähne: liegen am Boden, schwimmen auf sobald das Wasser kommt
  floaters.forEach(f=>{const up=L>f.gy+.1;f.g.position.y=up?L-.1+Math.sin(tt*1.4+f.ph)*bob:f.gy;
    f.g.rotation.z=up?Math.sin(tt*1.1+f.ph)*(.02+storm*.06):0});
  // Reiher
  birds.forEach(b=>{b.a+=dt*b.sp;const x=b.cx+Math.cos(b.a)*b.r,z=b.cz+Math.sin(b.a)*b.r*.55;
    b.g.position.set(x,b.y+Math.sin(tt*.8+b.ph)*.5,z);b.g.rotation.y=-b.a-Math.PI/2+Math.PI;
    const fl=Math.sin(tt*(7+b.ph)+b.ph)*.7;b.g.userData.wl.rotation.x=fl;b.g.userData.wr.rotation.x=-fl;b.g.visible=storm<.65});
  // Rauch
  puffs.forEach(p=>{p.t+=dt*.5;if(p.t>4)p.t-=4;const k=p.t/4;
    p.s.position.set(p.x+Math.sin(p.ph+p.t)*.2+WD[0]*k*(1.5+storm*5),p.y+k*3.2,p.z+WD[1]*k*(1.5+storm*5));
    const sz=.5+k*1.6;p.s.scale.set(sz,sz,1);p.s.material.opacity=.45*(1-k)*(storm>.7?.3:1)})

  const rainAmt=rainBox.checked?.2+.8*storm:0;
  const cnt=Math.floor(RN*rainAmt);rgeo.setDrawRange(0,cnt*2);rainMesh.visible=cnt>0;
  rainMat.opacity=.28+.3*storm;
  if(cnt>0){const ws=2+14*storm,vx=WD[0]*ws,vz=WD[1]*ws,vy=-(13+9*storm);
    rainMesh.position.set(controls.target.x,0,controls.target.z);
    for(let i=0;i<cnt;i++){const o=i*3;let x=rhead[o]+vx*dt,y=rhead[o+1]+vy*dt,z=rhead[o+2]+vz*dt;
      if(y<0){y+=16;x=(Math.random()-.5)*40;z=(Math.random()-.5)*40}
      if(x>20)x-=40;if(x<-20)x+=40;if(z>20)z-=40;if(z<-20)z+=40;
      rhead[o]=x;rhead[o+1]=y;rhead[o+2]=z;
      const k=.04+.012*storm;rpos[i*6]=x;rpos[i*6+1]=y;rpos[i*6+2]=z;rpos[i*6+3]=x-vx*k;rpos[i*6+4]=y-vy*k;rpos[i*6+5]=z-vz*k}
    rgeo.attributes.position.needsUpdate=true}
  leaves.visible=storm>.35;
  if(leaves.visible){const ws=(storm-.3)*22;leaves.position.set(controls.target.x,0,controls.target.z);
    for(let i=0;i<LN;i++){const o=i*3;lpos[o]+=WD[0]*ws*dt*(.6+hsh(i,0,0,1));lpos[o+2]+=WD[1]*ws*dt*(.6+hsh(i,1,0,2));lpos[o+1]+=Math.sin(tt*3+i)*dt*1.4;
      if(lpos[o]>15)lpos[o]-=30;if(lpos[o+2]>15)lpos[o+2]-=30;if(lpos[o+1]<.2||lpos[o+1]>5)lpos[o+1]=.5+Math.random()*4}
    lgeo.attributes.position.needsUpdate=true}
  if(storm>.5){nextBolt-=dt;if(nextBolt<0){strike();nextBolt=1.5+Math.random()*(7-5*storm)}}
  if(bolt){boltT-=dt;if(boltT<=0){scene.remove(bolt);bolt=null}}

  controls.update();renderer.render(scene,camera);
}
build();applyLevel(L0);loop();
window.hb={S,build,applyLevel,camera,controls,THREE:T,scene,strike,setStorm:v=>{stormTarget=null;storm=v;els.stormS.value=Math.round(v*100);applyLevel(L)},setV:v=>{prog=v/100;applyLevel(levelFromV(v))}};
})();
</script>
</body>
